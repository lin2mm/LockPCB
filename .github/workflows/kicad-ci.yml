name: KiCad validation

on:
  push:
    branches:
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kicad:
    name: KiCad 8 ERC / DRC / intent checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      KICAD_EXPECTED_MAJOR: "8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install KiCad 8 from the KiCad 8.0 release PPA
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y kicad

      - name: Run ERC, DRC, netlist, structure, parity and exports
        run: bash ci/run_ci.sh

      - name: Publish concise diagnostics to the check summary
        if: always()
        run: |
          echo '## KiCad CI summary' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/summary.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat reports/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in reports/version-gate.log reports/erc.log reports/drc.log reports/netlist_export.log reports/pcb_structure.log reports/schematic_intent_and_unconnected.log; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 40 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Annotate failing command details
        if: always()
        run: bash ci/publish_ci_errors.sh

      - name: Upload reports and renderings, including on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
